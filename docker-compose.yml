services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: daymate
      POSTGRES_USER: daymate
      POSTGRES_PASSWORD: daymate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daymate -d daymate"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
